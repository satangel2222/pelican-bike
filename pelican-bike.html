<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #87CEEB 0%, #E0F4FF 60%, #C8E6C9 100%);
    overflow: hidden;
  }
  svg {
    width: min(90vw, 600px);
    height: auto;
  }
</style>
</head>
<body>

<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 车轮渐变 -->
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
    <!-- 鹈鹕身体渐变 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#f5deb3"/>
    </linearGradient>
    <!-- 鹈鹕嘴渐变 -->
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="60%" stop-color="#ffa500"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <!-- 喉囊渐变 -->
    <radialGradient id="pouchGrad" cx="40%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff6347"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </radialGradient>
    <!-- 地面阴影 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="none"/>

  <!-- 云朵 -->
  <g opacity="0.85">
    <ellipse cx="80" cy="60" rx="45" ry="22" fill="white"/>
    <ellipse cx="110" cy="50" rx="30" ry="20" fill="white"/>
    <ellipse cx="55" cy="55" rx="25" ry="16" fill="white"/>

    <ellipse cx="480" cy="45" rx="50" ry="22" fill="white"/>
    <ellipse cx="515" cy="38" rx="30" ry="18" fill="white"/>
    <ellipse cx="455" cy="42" rx="22" ry="14" fill="white"/>

    <ellipse cx="300" cy="30" rx="35" ry="16" fill="white" opacity="0.6"/>
    <ellipse cx="325" cy="24" rx="22" ry="13" fill="white" opacity="0.6"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="340" width="600" height="60" fill="#7CB342"/>
  <ellipse cx="300" cy="340" rx="320" ry="12" fill="#8BC34A"/>

  <!-- 地面阴影（随鹈鹕上下浮动） -->
  <ellipse cx="300" cy="342" rx="55" ry="8" fill="url(#shadowGrad)">
    <animate attributeName="rx" values="55;48;55" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== 自行车 ===== -->
  <g id="bike">
    <!-- 后轮 -->
    <g transform="translate(210,290)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="url(#wheelGrad)" stroke-width="5"/>
      <!-- 辐条 -->
      <g stroke="#666" stroke-width="1.5">
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="34" y1="-34" x2="-34" y2="34"/>
        <line x1="-12" y1="-46" x2="12" y2="46"/>
        <line x1="12" y1="-46" x2="-12" y2="46"/>
        <line x1="-46" y1="-12" x2="46" y2="12"/>
        <line x1="-46" y1="12" x2="46" y2="-12"/>
      </g>
      <!-- 轮毂 -->
      <circle cx="0" cy="0" r="8" fill="#888"/>
      <circle cx="0" cy="0" r="4" fill="#aaa"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="0.5s" repeatCount="indefinite"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(390,290)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="url(#wheelGrad)" stroke-width="5"/>
      <g stroke="#666" stroke-width="1.5">
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="34" y1="-34" x2="-34" y2="34"/>
        <line x1="-12" y1="-46" x2="12" y2="46"/>
        <line x1="12" y1="-46" x2="-12" y2="46"/>
        <line x1="-46" y1="-12" x2="46" y2="12"/>
        <line x1="-46" y1="12" x2="46" y2="-12"/>
      </g>
      <circle cx="0" cy="0" r="8" fill="#888"/>
      <circle cx="0" cy="0" r="4" fill="#aaa"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="0.5s" repeatCount="indefinite"/>
    </g>

    <!-- 车架 -->
    <g stroke="#C62828" stroke-width="5" stroke-linecap="round" fill="none">
      <!-- 下管 -->
      <line x1="210" y1="290" x2="300" y2="250"/>
      <!-- 座管 -->
      <line x1="300" y1="250" x2="285" y2="200"/>
      <!-- 上管 -->
      <line x1="285" y1="200" x2="390" y2="220"/>
      <!-- 后叉 -->
      <line x1="210" y1="290" x2="300" y2="250"/>
      <!-- 前叉 -->
      <line x1="390" y1="220" x2="390" y2="290"/>
      <!-- 座管横梁 -->
      <line x1="285" y1="200" x2="250" y2="290"/>
      <!-- 把手立管 -->
      <line x1="390" y1="220" x2="395" y2="195"/>
    </g>

    <!-- 车把 -->
    <line x1="380" y1="190" x2="410" y2="190" stroke="#C62828" stroke-width="5" stroke-linecap="round"/>
    <line x1="380" y1="190" x2="378" y2="198" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
    <line x1="410" y1="190" x2="412" y2="198" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>

    <!-- 脚踏板 -->
    <g transform="translate(300,250)">
      <rect x="-15" y="-4" width="30" height="8" rx="3" fill="#555"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 0 0" to="360 0 0" dur="0.5s" repeatCount="indefinite"/>
    </g>

    <!-- 车座 -->
    <ellipse cx="285" cy="196" rx="20" ry="6" fill="#333"/>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g id="pelican" transform="translate(0,0)">
    <!-- 身体上下浮动 -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-6; 0,0" dur="0.5s" repeatCount="indefinite"/>

    <!-- 身体 -->
    <ellipse cx="285" cy="168" rx="45" ry="30" fill="url(#bodyGrad)" stroke="#d4a574" stroke-width="1.5"/>
    <!-- 背部高光 -->
    <ellipse cx="278" cy="155" rx="28" ry="14" fill="white" opacity="0.3"/>

    <!-- 左翅膀 -->
    <ellipse cx="265" cy="165" rx="22" ry="14" fill="#f0e0c0" stroke="#d4a574" stroke-width="1"
      transform="rotate(-15, 265, 165)"/>
    <!-- 右翅膀（稍微抬起） -->
    <ellipse cx="305" cy="162" rx="22" ry="14" fill="#f0e0c0" stroke="#d4a574" stroke-width="1"
      transform="rotate(10, 305, 162)">
      <animate attributeName="ry" values="14;16;14" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 脖子 -->
    <path d="M 265 155 Q 250 130 260 110 Q 270 90 285 85"
      fill="none" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 265 155 Q 250 130 260 110 Q 270 90 285 85"
      fill="none" stroke="#d4a574" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

    <!-- 头 -->
    <circle cx="287" cy="80" r="22" fill="url(#bodyGrad)" stroke="#d4a574" stroke-width="1.5"/>

    <!-- 眼睛 -->
    <circle cx="295" cy="74" r="7" fill="white"/>
    <circle cx="297" cy="73" r="4.5" fill="#222"/>
    <circle cx="298.5" cy="71.5" r="1.5" fill="white"/>

    <!-- 眼眶 -->
    <path d="M 289 67 Q 297 63 305 67" fill="none" stroke="#d4a574" stroke-width="1.5"/>

    <!-- 头顶羽毛 -->
    <path d="M 277 62 Q 280 50 287 58" fill="none" stroke="#d4a574" stroke-width="2" stroke-linecap="round"/>
    <path d="M 283 60 Q 287 48 293 57" fill="none" stroke="#d4a574" stroke-width="2" stroke-linecap="round"/>
    <path d="M 290 59 Q 295 47 300 56" fill="none" stroke="#d4a574" stroke-width="2" stroke-linecap="round"/>

    <!-- 上喙 -->
    <path d="M 298 80 Q 340 75 360 82 Q 362 86 355 90 Q 340 92 298 88 Z"
      fill="url(#billGrad)" stroke="#d4890a" stroke-width="1"/>

    <!-- 喙峰 -->
    <path d="M 310 80 Q 340 78 360 82" fill="none" stroke="#d4890a" stroke-width="1" opacity="0.5"/>

    <!-- 下喙 & 喉囊 -->
    <path d="M 298 88 Q 330 88 355 90 Q 362 86 355 100 Q 340 120 315 118 Q 295 115 298 88 Z"
      fill="url(#pouchGrad)" stroke="#cc3300" stroke-width="1" opacity="0.9"/>

    <!-- 喉囊高光 -->
    <ellipse cx="325" cy="102" rx="18" ry="10" fill="#ff7f6e" opacity="0.4"/>

    <!-- 喙缝线 -->
    <path d="M 298 88 Q 325 90 355 90" fill="none" stroke="#d4890a" stroke-width="0.8" opacity="0.6"/>

    <!-- 左腿 -->
    <line x1="270" y1="192" x2="265" y2="238" stroke="#ff8c00" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x2" values="265;260;265" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <!-- 左脚 -->
    <g transform="translate(265, 238)">
      <path d="M -8 0 L -10 6 M 0 0 L 0 7 M 8 0 L 10 6" stroke="#ff8c00" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 右腿 -->
    <line x1="295" y1="192" x2="300" y2="238" stroke="#ff8c00" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x2" values="300;305;300" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <!-- 右脚 -->
    <g transform="translate(300, 238)">
      <path d="M -8 0 L -10 6 M 0 0 L 0 7 M 8 0 L 10 6" stroke="#ff8c00" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 尾巴 -->
    <path d="M 240 175 Q 225 180 222 195 Q 228 185 240 182 Z" fill="#f0e0c0" stroke="#d4a574" stroke-width="1"/>
  </g>

  <!-- 小气泡（氛围） -->
  <circle cx="370" cy="65" r="3" fill="rgba(255,255,255,0.7)">
    <animate attributeName="cy" values="65;55;65" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="385" cy="72" r="2" fill="rgba(255,255,255,0.6)">
    <animate attributeName="cy" values="72;60;72" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- 小草 -->
  <g stroke="#6B8E23" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 100 340 Q 98 328 102 322"/>
    <path d="M 105 340 Q 108 325 103 318"/>
    <path d="M 110 340 Q 107 332 112 326"/>

    <path d="M 500 340 Q 498 328 502 322"/>
    <path d="M 505 340 Q 508 325 503 318"/>
    <path d="M 510 340 Q 507 332 512 326"/>

    <path d="M 180 340 Q 178 332 181 327"/>
    <path d="M 185 340 Q 187 330 184 324"/>
  </g>
</svg>

</body>
</html>
