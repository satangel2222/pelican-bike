<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 🦢🚲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  svg { max-width: 100vw; height: auto; display: block; }
  @keyframes cloudDrift {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-300px); }
  }
  .cloud { animation: cloudDrift linear infinite; }
  .cloud:nth-child(2) { animation-duration: 22s; animation-delay: -8s;  opacity: 0.5; }
  .cloud:nth-child(3) { animation-duration: 30s; animation-delay: -18s; opacity: 0.35; }
  @keyframes starTwinkle {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 1.0; }
  }
  .star { animation: starTwinkle ease-in-out infinite; }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 800 520" width="800" height="520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0a2e"/>
      <stop offset="55%"  stop-color="#151550"/>
      <stop offset="100%" stop-color="#2a2a6e"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2d5a27"/>
      <stop offset="100%" stop-color="#1a3a15"/>
    </linearGradient>
    <radialGradient id="wheelGrad" cx="35%" cy="30%">
      <stop offset="0%"   stop-color="#666"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#skyGrad)"/>

  <g id="frame-counter">
    <rect x="8" y="8" width="160" height="34" rx="8" fill="black" opacity="0.65"/>
    <text id="frame-text" x="18" y="32" font-family="monospace" font-size="20" fill="#00ff88" font-weight="bold">FRAME: 0</text>
  </g>

  <circle class="star" cx="60"  cy="30"  r="1.8" fill="white" style="animation-duration:2.1s"/>
  <circle class="star" cx="130" cy="55"  r="1.2" fill="white" style="animation-duration:3.3s;animation-delay:0.5s"/>
  <circle class="star" cx="200" cy="25"  r="2.0" fill="white" style="animation-duration:1.8s;animation-delay:1.0s"/>
  <circle class="star" cx="280" cy="70"  r="1.4" fill="white" style="animation-duration:2.7s;animation-delay:0.3s"/>
  <circle class="star" cx="360" cy="40"  r="1.0" fill="white" style="animation-duration:3.0s;animation-delay:1.5s"/>
  <circle class="star" cx="440" cy="20"  r="1.6" fill="white" style="animation-duration:2.4s;animation-delay:0.8s"/>
  <circle class="star" cx="520" cy="60"  r="1.2" fill="white" style="animation-duration:1.9s;animation-delay:2.0s"/>
  <circle class="star" cx="600" cy="35"  r="1.8" fill="white" style="animation-duration:2.6s;animation-delay:0.6s"/>
  <circle class="star" cx="680" cy="75"  r="1.4" fill="white" style="animation-duration:3.1s;animation-delay:1.2s"/>
  <circle class="star" cx="750" cy="25"  r="1.0" fill="white" style="animation-duration:2.2s;animation-delay:0.9s"/>
  <circle class="star" cx="90"  cy="100" r="0.8" fill="white" style="animation-duration:2.8s;animation-delay:1.7s"/>
  <circle class="star" cx="170" cy="120" r="1.3" fill="white" style="animation-duration:1.7s;animation-delay:0.4s"/>
  <circle class="star" cx="300" cy="110" r="1.0" fill="white" style="animation-duration:3.2s;animation-delay:2.2s"/>
  <circle class="star" cx="480" cy="105" r="0.9" fill="white" style="animation-duration:2.0s;animation-delay:1.1s"/>
  <circle class="star" cx="640" cy="115" r="1.5" fill="white" style="animation-duration:2.5s;animation-delay:0.7s"/>

  <circle cx="700" cy="65" r="45" fill="#fff9c4" opacity="0.95" filter="url(#glow)"/>
  <circle cx="718" cy="50" r="37" fill="#0a0a2e"/>

  <g class="cloud">
    <ellipse cx="100"  cy="95"  rx="70" ry="25" fill="white" opacity="0.18"/>
    <ellipse cx="65"   cy="83"  rx="48" ry="20" fill="white" opacity="0.18"/>
    <ellipse cx="140"  cy="88"  rx="52" ry="18" fill="white" opacity="0.18"/>
  </g>
  <g class="cloud">
    <ellipse cx="380"  cy="70"  rx="58" ry="20" fill="white" opacity="0.14"/>
    <ellipse cx="352"  cy="61"  rx="40" ry="16" fill="white" opacity="0.14"/>
    <ellipse cx="412"  cy="65"  rx="46" ry="17" fill="white" opacity="0.14"/>
  </g>
  <g class="cloud">
    <ellipse cx="620"  cy="120" rx="62" ry="22" fill="white" opacity="0.1"/>
    <ellipse cx="592"  cy="111" rx="44" ry="16" fill="white" opacity="0.1"/>
    <ellipse cx="652"  cy="115" rx="50" ry="18" fill="white" opacity="0.1"/>
  </g>

  <rect x="0" y="440" width="800" height="80" fill="url(#groundGrad)"/>
  <rect x="0" y="458" width="800" height="35" fill="#1a1a38" opacity="0.7"/>
  <line x1="0" y1="475" x2="800" y2="475" stroke="#fff9c4" stroke-width="2.5" stroke-dasharray="50,35" opacity="0.25"/>

  <g id="bike" filter="url(#softShadow)">

    <ellipse id="shadow" cx="400" cy="442" rx="155" ry="10" fill="black" opacity="0.22"/>

    <g id="rear-wheel">
      <circle cx="280" cy="390" r="50" fill="none" stroke="url(#wheelGrad)" stroke-width="8"/>
      <line id="rs0" x1="280" y1="340" x2="280" y2="440" stroke="#999" stroke-width="2.5"/>
      <line id="rs1" x1="330" y1="390" x2="230" y2="390" stroke="#999" stroke-width="2.5"/>
      <line id="rs2" x1="315" y1="355" x2="245" y2="425" stroke="#999" stroke-width="2.5"/>
      <line id="rs3" x1="245" y1="355" x2="315" y2="425" stroke="#999" stroke-width="2.5"/>
      <line id="rs4" x1="280" y1="390" x2="280" y2="390" stroke="#888" stroke-width="2.5"/>
      <line id="rs5" x1="280" y1="390" x2="280" y2="390" stroke="#888" stroke-width="2.5"/>
      <line id="rs6" x1="280" y1="390" x2="280" y2="390" stroke="#888" stroke-width="2.5"/>
      <line id="rs7" x1="280" y1="390" x2="280" y2="390" stroke="#888" stroke-width="2.5"/>
      <circle cx="280" cy="390" r="9"  fill="#bbb"/>
      <circle cx="280" cy="390" r="4.5" fill="#666"/>
    </g>

    <g id="front-wheel">
      <circle cx="500" cy="390" r="50" fill="none" stroke="url(#wheelGrad)" stroke-width="8"/>
      <line id="fs0" x1="500" y1="340" x2="500" y2="440" stroke="#999" stroke-width="2.5"/>
      <line id="fs1" x1="550" y1="390" x2="450" y2="390" stroke="#999" stroke-width="2.5"/>
      <line id="fs2" x1="535" y1="355" x2="465" y2="425" stroke="#999" stroke-width="2.5"/>
      <line id="fs3" x1="465" y1="355" x2="535" y2="425" stroke="#999" stroke-width="2.5"/>
      <line id="fs4" x1="500" y1="390" x2="500" y2="390" stroke="#888" stroke-width="2.5"/>
      <line id="fs5" x1="500" y1="390" x2="500" y2="390" stroke="#888" stroke-width="2.5"/>
      <line id="fs6" x1="500" y1="390" x2="500" y2="390" stroke="#888" stroke-width="2.5"/>
      <line id="fs7" x1="500" y1="390" x2="500" y2="390" stroke="#888" stroke-width="2.5"/>
      <circle cx="500" cy="390" r="9"  fill="#bbb"/>
      <circle cx="500" cy="390" r="4.5" fill="#666"/>
    </g>

    <line x1="280" y1="382" x2="500" y2="382" stroke="#e74c3c" stroke-width="9" stroke-linecap="round"/>
    <line x1="280" y1="382" x2="290" y2="300" stroke="#e74c3c" stroke-width="9" stroke-linecap="round"/>
    <line x1="290" y1="300" x2="455" y2="318" stroke="#e74c3c" stroke-width="9" stroke-linecap="round"/>
    <line x1="500" y1="382" x2="510" y2="302" stroke="#e74c3c" stroke-width="9" stroke-linecap="round"/>
    <line x1="290" y1="300" x2="455" y2="300" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>

    <line x1="492" y1="302" x2="525" y2="285" stroke="#999" stroke-width="6" stroke-linecap="round"/>
    <line x1="505" y1="285" x2="535" y2="285" stroke="#999" stroke-width="5" stroke-linecap="round"/>

    <g id="crank">
      <line id="crank-rear" x1="280" y1="382" x2="255" y2="405" stroke="#777" stroke-width="7" stroke-linecap="round"/>
      <rect id="pedal-rear" x="238" y="401" width="30" height="10" rx="4" fill="#333"/>
      <line id="crank-front" x1="280" y1="382" x2="305" y2="359" stroke="#777" stroke-width="7" stroke-linecap="round"/>
      <rect id="pedal-front" x="299" y="349" width="30" height="10" rx="4" fill="#333"/>
    </g>

    <rect x="268" y="287" width="48" height="14" rx="7" fill="#2c2c2c"/>
    <rect x="273" y="284" width="38" height="9"  rx="5" fill="#1a1a1a"/>

    <g id="pelican">

      <ellipse id="body" cx="380" cy="260" rx="80" ry="55" fill="#f5f5f0"/>
      <ellipse cx="380" cy="270" rx="65" ry="42" fill="#fafaf5"/>
      <ellipse id="wing-left" cx="342" cy="248" rx="44" ry="26" fill="#e0e0d5" transform="rotate(-12 342 248)"/>
      <ellipse id="wing-right" cx="418" cy="248" rx="44" ry="26" fill="#e0e0d5" transform="rotate(12 418 248)"/>

      <ellipse id="feather-l" cx="300" cy="235" rx="26" ry="11" fill="#ccc8be" transform="rotate(-22 300 235)"/>
      <ellipse id="feather-r" cx="460" cy="235" rx="26" ry="11" fill="#ccc8be" transform="rotate(22 460 235)"/>

      <path id="neck" d="M 400 225 Q 412 192 395 165 Q 380 142 362 130"
            stroke="#f5f5f0" stroke-width="26" fill="none" stroke-linecap="round"/>
      <path d="M 403 225 Q 415 192 398 165 Q 383 142 365 130"
            stroke="#ddd9cf" stroke-width="12" fill="none" stroke-linecap="round"/>

      <ellipse id="head" cx="352" cy="123" rx="35" ry="30" fill="#f5f5f0"/>

      <path d="M 320 120 Q 252 110 220 132 Q 242 143 320 132 Z" fill="#f0a030"/>
      <path d="M 320 132 Q 252 143 225 138 Q 218 132 225 124
               Q 242 116 320 120 Q 320 126 320 132" fill="#e08020"/>
      <path id="pouch" d="M 225 138 Q 238 175 278 182 Q 320 180 325 164
               Q 328 148 320 132 Q 252 143 225 138" fill="#f4a030" opacity="0.88"/>
      <path d="M 242 158 Q 278 168 308 160" stroke="#d89020" stroke-width="1.2" fill="none" opacity="0.5"/>
      <path d="M 238 148 Q 278 158 310 152" stroke="#d89020" stroke-width="1"   fill="none" opacity="0.4"/>

      <circle cx="354" cy="108" r="10"  fill="white"/>
      <circle cx="357" cy="108" r="6.5" fill="#222"/>
      <circle cx="360" cy="105" r="2.5" fill="white"/>
      <circle cx="354" cy="108" r="10" fill="none" stroke="#f0a030" stroke-width="2.5"/>
      <path d="M 335 95 Q 342 78 352 88 Q 360 78 368 94"
            stroke="#ddd9cf" stroke-width="5" fill="none" stroke-linecap="round"/>

      <ellipse cx="455" cy="270" rx="24" ry="16" fill="#ddd9cf" transform="rotate(22 455 270)"/>
      <ellipse cx="458" cy="276" rx="19" ry="12" fill="#ccc8be" transform="rotate(28 458 276)"/>

      <path id="leg-left"  d="M 355 308 Q 338 345 255 405"
            stroke="#f0a030" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path id="leg-right" d="M 405 308 Q 422 345 305 359"
            stroke="#f0a030" stroke-width="12" fill="none" stroke-linecap="round"/>
      <ellipse id="foot-l" cx="255" cy="408" rx="16" ry="7" fill="#e08020"/>
      <ellipse id="foot-r" cx="305" cy="361" rx="16" ry="7" fill="#e08020"/>
    </g>
  </g>

  <g id="speed-lines" opacity="0.25">
    <line x1="0"   y1="385" x2="100" y2="385" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10"  y1="370" x2="80"  y2="370" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="5"   y1="400" x2="90"  y2="400" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0"   y1="415" x2="110" y2="415" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="15"  y1="430" x2="85"  y2="430" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0"   y1="360" x2="65"  y2="360" stroke="white" stroke-width="1.0" stroke-linecap="round"/>
  </g>
</svg>

<script>
(function() {
  const svg = document.getElementById('scene');
  const bike = document.getElementById('bike');

  const rearCx = 280, rearCy = 390, rearR = 50;
  const frontCx = 500, frontCy = 390;

  const crankAx = 280, crankAy = 382;
  const crankLen = 28;

  const shadow = document.getElementById('shadow');

  let bounceT = 0;
  let featherT = 0;
  let speedT = 0;

  function animate(ts) {
    const t = ts * 0.001;

    const wheelAngle = t * 1.5 * Math.PI * 2;

    for (let i = 0; i < 8; i++) {
      const a = wheelAngle + (i * Math.PI / 4);
      const cosA = Math.cos(a), sinA = Math.sin(a);

      const rearSpoke = document.getElementById('rs' + i);
      const frontSpoke = document.getElementById('fs' + i);

      if (rearSpoke) {
        rearSpoke.setAttribute('x1', (rearCx + rearR * cosA).toFixed(1));
        rearSpoke.setAttribute('y1', (rearCy + rearR * sinA).toFixed(1));
        rearSpoke.setAttribute('x2', (rearCx - rearR * cosA).toFixed(1));
        rearSpoke.setAttribute('y2', (rearCy - rearR * sinA).toFixed(1));
      }
      if (frontSpoke) {
        frontSpoke.setAttribute('x1', (frontCx + rearR * cosA).toFixed(1));
        frontSpoke.setAttribute('y1', (frontCy + rearR * sinA).toFixed(1));
        frontSpoke.setAttribute('x2', (frontCx - rearR * cosA).toFixed(1));
        frontSpoke.setAttribute('y2', (frontCy - rearR * sinA).toFixed(1));
      }
    }

    const blurLevel = 0.5 + 0.5 * Math.abs(Math.sin(wheelAngle));
    const rearWheelEl = document.getElementById('rear-wheel');
    const frontWheelEl = document.getElementById('front-wheel');
    if (rearWheelEl)  rearWheelEl.setAttribute('opacity', (0.88 + blurLevel * 0.12).toFixed(2));
    if (frontWheelEl) frontWheelEl.setAttribute('opacity', (0.88 + blurLevel * 0.12).toFixed(2));

    const crankAngle = wheelAngle;

    const rcX = crankAx + crankLen * Math.cos(crankAngle + Math.PI * 0.5);
    const rcY = crankAy + crankLen * Math.sin(crankAngle + Math.PI * 0.5);
    const fcX = crankAx + crankLen * Math.cos(crankAngle - Math.PI * 0.5);
    const fcY = crankAy + crankLen * Math.sin(crankAngle - Math.PI * 0.5);

    const crankRear  = document.getElementById('crank-rear');
    const crankFront = document.getElementById('crank-front');
    const pedalRear  = document.getElementById('pedal-rear');
    const pedalFront = document.getElementById('pedal-front');

    if (crankRear)  crankRear.setAttribute('x2',  rcX.toFixed(1));
    if (crankRear)  crankRear.setAttribute('y2',  rcY.toFixed(1));
    if (crankFront) crankFront.setAttribute('x2', fcX.toFixed(1));
    if (crankFront) crankFront.setAttribute('y2', fcY.toFixed(1));

    if (pedalRear) {
      const px = rcX - 15, py = rcY - 5;
      const rot = (crankAngle * 180 / Math.PI + 90) % 360;
      pedalRear.setAttribute('x',      px.toFixed(0));
      pedalRear.setAttribute('y',      py.toFixed(0));
      pedalRear.setAttribute('transform', `rotate(${rot} ${rcX.toFixed(0)} ${rcY.toFixed(0)})`);
    }
    if (pedalFront) {
      const px = fcX - 15, py = fcY - 5;
      const rot = (crankAngle * 180 / Math.PI - 90) % 360;
      pedalFront.setAttribute('x',      px.toFixed(0));
      pedalFront.setAttribute('y',      py.toFixed(0));
      pedalFront.setAttribute('transform', `rotate(${rot} ${fcX.toFixed(0)} ${fcY.toFixed(0)})`);
    }

    const leftLeg  = document.getElementById('leg-left');
    const rightLeg = document.getElementById('leg-right');
    const footL   = document.getElementById('foot-l');
    const footR   = document.getElementById('foot-r');

    const hipLX = 355, hipLY = 308;
    const kneeLX = hipLX - 8 + 18 * Math.sin(crankAngle * 2);
    const kneeLY = hipLY + 38 + 10 * Math.cos(crankAngle * 2);

    if (leftLeg) leftLeg.setAttribute('d',
      `M ${hipLX} ${hipLY} Q ${kneeLX.toFixed(0)} ${kneeLY.toFixed(0)} ${rcX.toFixed(0)} ${rcY.toFixed(0)}`);
    if (footL) {
      footL.setAttribute('cx', rcX.toFixed(0));
      footL.setAttribute('cy', (rcY + 4).toFixed(0));
      footL.setAttribute('transform', `rotate(${(crankAngle * 180 / Math.PI) % 360} ${rcX.toFixed(0)} ${rcY.toFixed(0)})`);
    }

    const hipRX = 405, hipRY = 308;
    const kneeRX = hipRX + 6 + 20 * Math.sin(crankAngle * 2 + 1.2);
    const kneeRY = hipRY + 32 + 12 * Math.cos(crankAngle * 2 + 1.2);

    if (rightLeg) rightLeg.setAttribute('d',
      `M ${hipRX} ${hipRY} Q ${kneeRX.toFixed(0)} ${kneeRY.toFixed(0)} ${fcX.toFixed(0)} ${fcY.toFixed(0)}`);
    if (footR) {
      footR.setAttribute('cx', fcX.toFixed(0));
      footR.setAttribute('cy', (fcY + 4).toFixed(0));
      footR.setAttribute('transform', `rotate(${(crankAngle * 180 / Math.PI) % 360} ${fcX.toFixed(0)} ${fcY.toFixed(0)})`);
    }

    bounceT += 0.15;
    const bounceY = Math.abs(Math.sin(bounceT)) * 6;
    const swayX = Math.sin(bounceT * 0.5) * 1.5;
    bike.setAttribute('transform', `translate(${swayX.toFixed(2)}, ${-bounceY.toFixed(2)})`);

    shadow.setAttribute('opacity', (0.18 + (bounceY / 6) * 0.08).toFixed(2));
    shadow.setAttribute('rx', (155 - bounceY * 1.5).toFixed(0));

    featherT += 0.06;
    const flapL = Math.sin(featherT * 3.5) * 10;
    const flapR = Math.sin(featherT * 3.5 + 0.8) * 10;
    const featherL = document.getElementById('feather-l');
    const featherR = document.getElementById('feather-r');
    if (featherL) featherL.setAttribute('transform', `rotate(${-22 + flapL} 300 235)`);
    if (featherR) featherR.setAttribute('transform', `rotate(${(22 + flapR).toFixed(1)} 460 235)`);

    const wingL = document.getElementById('wing-left');
    const wingR = document.getElementById('wing-right');
    if (wingL) wingL.setAttribute('transform', `rotate(${-12 + flapL * 0.5} 342 248)`);
    if (wingR) wingR.setAttribute('transform', `rotate(${(12 + flapR * 0.5).toFixed(1)} 418 248)`);

    const pouch = document.getElementById('pouch');
    if (pouch) {
      pouch.setAttribute('opacity', (0.82 + 0.06 * Math.sin(featherT * 1.5)).toFixed(2));
    }

    const frameText = document.getElementById('frame-text');
    const frame = Math.floor(t * 60);
    if (frameText) frameText.textContent = 'FRAME: ' + frame;

    speedT += 0.08;
    const sl = document.getElementById('speed-lines');
    if (sl) {
      sl.setAttribute('opacity', (0.12 + Math.abs(Math.sin(speedT * 2)) * 0.2).toFixed(2));
      sl.setAttribute('transform', `translate(${-(speedT * 60 % 120).toFixed(0)}, 0)`);
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
